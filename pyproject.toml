[project]
name = "hgrag"
version = "0.1.0"
description = "GraphRAG question answering over Vietnamese history (905-1975)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "neo4j>=5.20.0",
    "qdrant-client>=1.12.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "scikit-learn>=1.4",
    "streamlit>=1.40",
    "pyvis>=0.3.2",
    "matplotlib>=3.8",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# heavy optional deps for local embedding models (used on Kaggle)
local = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[project.scripts]
hgrag-ingest = "hgrag.cli:ingest_main"
hgrag-ask = "hgrag.cli:ask_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hgrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires network access (Wikipedia/Wikidata)",
    "docker: test requires running docker services (Neo4j/Qdrant)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
