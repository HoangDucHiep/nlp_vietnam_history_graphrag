# Configuration for the Vietnamese History GraphRAG system.
# Every value can be overridden by an environment variable (see config.py).

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts: artifacts
  reports: reports
  cache: artifacts/llm_cache

llm:
  provider: auto            # auto | gemini | openai | mock
  # Quota free tier của Google AI Studio:
  #   * các model Gemini (flash/flash-lite) -- 20 (flash) hoặc 500 (lite)
  #     request **mỗi ngày**, và hết sạch khi nhiều worker chạy song song;
  #   * các model Gemma -- 30 request **mỗi phút**, bucket quota riêng biệt,
  #     nên vẫn dùng được khi quota ngày của Gemini đã cạn.
  # Vì vậy model chính là Gemma (bền vững), còn Gemini là dự phòng.
  model: gemma-4-26b-a4b-it
  fallback_models:
    - gemini-flash-lite-latest
    - gemini-3.5-flash
    - gemini-3.8-flash
    - gemini-3.1-flash-lite
  # Giới hạn req/phút của từng model, để client tự giãn nhịp gọi thay vì
  # ăn 429 rồi xoay vòng (mỗi lần 429 đều đốt quota của model dự phòng).
  model_rpm:
    gemma-4-26b-a4b-it: 26
    gemma-4-31b-it: 26
    gemini-flash-lite-latest: 14
    gemini-3.5-flash: 14
    gemini-3.8-flash: 14
    gemini-3.1-flash-lite: 14
  # Quota thật của Gemma là **token đầu vào / phút**
  # (GenerateContentInputTokensPerModelPerMinute = 16 000), không phải số
  # request.  Bộ giới hạn token dùng chung giữa các worker (flock) nên mọi
  # tiến trình cùng chia sẻ một hạn mức toàn cục.
  # Xem docs/10_quota_gemini_free_tier.md.
  model_tpm:
    gemma-4-26b-a4b-it: 14500
  # Bật/tắt việc đếm token chính xác bằng `count_tokens` (không tốn quota).
  count_tokens: true
  embed_model: gemini-embedding-2
  # Quota của model embedding là độc lập với quota chat.  Khi model chính
  # cạn, client chuyển sang model dự phòng -- khi đó corpus phải được
  # embed lại bằng đúng model đó để không gian vector còn nhất quán.
  fallback_embed_models:
    - gemini-embedding-2-preview
  temperature: 0.0
  # Ngân sách token **output**.  Gemma 4 tính token suy luận (thinking) vào
  # `max_output_tokens`: nếu ngân sách quá nhỏ, toàn bộ ngân sách bị suy
  # luận ăn hết và phần trả lời trả về rỗng (`finish_reason=MAX_TOKENS`).
  # Đo đạc thực nghiệm: suy luận cần 250–1 100 token cho câu có CONTEXT.
  # Xem docs/10_quota_gemini_free_tier.md.
  max_output_tokens: 4096
  request_timeout: 120
  max_retries: 4
  retry_base_delay: 2.0
  cache_enabled: true
  openai_base_url: ""       # for OpenAI-compatible endpoints (vLLM on Kaggle)
  openai_model: ""

embedding:
  provider: auto            # auto | gemini | local | mock
  dim: 768
  batch_size: 64
  # Model embedding *cục bộ* dùng khi quota Gemini cạn (hoặc chạy hoàn toàn
  # offline).  Mô hình đa ngôn ngữ 384 chiều, chạy tốt trên CPU.
  local_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  # Mô hình mạnh hơn, dùng trên Kaggle GPU.
  local_model_gpu: Qwen/Qwen3-Embedding-0.6B

neo4j:
  uri: bolt://localhost:7687
  http_uri: http://localhost:7474
  user: neo4j
  password_env: NEO4J_PASSWORD
  default_password: history2025
  database: neo4j
  batch_size: 500

qdrant:
  url: http://localhost:6333
  collection_chunks: chunks
  # Collection riêng cho vector tạo bởi model embedding *cục bộ* (384 dim).
  # Cần thiết vì collection `chunks` chứa vector 768 dim của Gemini.
  collection_chunks_local: chunks_local
  # Collection riêng cho các câu VHE gold (tiếng Việt cổ).  Tách riêng vì
  # (a) văn phong khác hẳn Wikipedia và (b) để pipeline QA tìm kiếm được
  # cả hai corpus rồi gộp kết quả (xem qa/pipeline.py::_search_collections).
  collection_chunks_vhe: chunks_vhe
  collection_chunks_vhe_local: chunks_vhe_local
  collection_nodes: nodes
  vector_size: 768
  distance: Cosine

ingest:
  wikipedia_seed_limit: 40
  wikipedia_expand_rounds: 1
  wikipedia_max_articles: 300
  wikipedia_min_chars: 400
  wikipedia_max_chars: 120000
  history_chat_limit: 15000
  history_chat_max_year: 1975
  history_chat_min_year: 905
  request_delay: 0.5
  user_agent: "VietnamHistoryGraphRAG/0.1 (research; course project)"

chunking:
  max_chars: 1400
  overlap_chars: 200
  min_chars: 120

extraction:
  max_chunks: 600
  max_events_per_chunk: 4

retrieval:
  vector_top_k: 30
  rerank_top_k: 10
  # auto | heuristic | cross-encoder
  # `auto` chỉ dùng cross-encoder khi có GPU: trên CPU nó tốn ~35s/lần gọi,
  # khiến cả lượt đánh giá 150 câu x 11 hệ thống mất hàng giờ.
  rerank_backend: auto
  rerank_model: BAAI/bge-reranker-v2-m3
  graph_max_hops: 3
  graph_max_paths: 20
  graph_max_paths_per_hop: 30
  rrf_k: 60
  context_max_tokens: 6000
  max_evidence: 12
  max_evidence_per_doc: 3
  temporal_boost: 0.15
  entity_link_min_confidence: 0.7
  alias_confidence: 0.95
  redirect_confidence: 0.9
  normalized_confidence: 0.85
  embedding_link_min_score: 0.86

evaluation:
  eval_size_target: 150
  eval_exclusive_doc_ratio: 0.15
  bootstrap_samples: 2000
  bootstrap_ci: 0.95
  seed: 42
